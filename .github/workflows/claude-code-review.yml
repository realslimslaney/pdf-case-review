name: Claude Code Review

on:
  pull_request:
    # PRs open as drafts by convention; review once when marked ready (and on reopen).
    # Re-reviews after changes are on demand via an @claude comment (claude.yml).
    types: [ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip bot PRs (Dependabot, release-please), drafts, and fork PRs: GitHub withholds secrets
    # from pull_request runs that originate from forks, so the job would fail on a missing token.
    if: |
      github.event.pull_request.user.type != 'Bot' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    # GITHUB_TOKEN is the only GitHub credential (github_token below): inline review comments
    # need pull-requests write; contents stays read so the review can never push.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review diffs the PR against its base; a shallow clone has no base to diff.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} medium'
          # The reviewer needs to read the PR (gh, git, files) before it can comment on it, and
          # gh pr comment to post its summary (inline findings go through the MCP tool).
          claude_args: '--model opus --allowedTools "Read,Grep,Glob,Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),mcp__github_inline_comment__create_inline_comment"'
          # Public repository: the reviewer's reasoning in the log is as public as the code it reads.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

