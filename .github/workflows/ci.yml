name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cache PDF.js
        uses: actions/cache@v6
        with:
          path: vendor/pdfjs
          key: pdfjs-${{ hashFiles('pdfjs.lock.json', 'patches/pdfjs/**') }}
      - name: Vendor PDF.js
        run: pnpm prepare-pdfjs
      - name: Fixtures
        run: pnpm fixtures
      - name: Typecheck, lint, unit tests
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: pnpm test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: pnpm exec vsce package --no-dependencies --out pdf-case-review.vsix
      - name: VSIX size under 15 MB
        if: runner.os == 'Linux'
        run: |
          size=$(stat -c%s pdf-case-review.vsix)
          echo "VSIX size: $size bytes"
          test "$size" -lt 15728640
      - name: Upload VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pdf-case-review.vsix
          path: pdf-case-review.vsix
      - name: Audit shipped dependencies
        if: runner.os == 'Linux'
        # Only what ends up in the VSIX; advisories in dev tooling are handled by Dependabot.
        run: pnpm audit --prod --audit-level high

  e2e:
    name: webview smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cache PDF.js
        uses: actions/cache@v6
        with:
          path: vendor/pdfjs
          key: pdfjs-${{ hashFiles('pdfjs.lock.json', 'patches/pdfjs/**') }}
      - name: Vendor PDF.js
        run: pnpm prepare-pdfjs
      - name: Fixtures
        run: pnpm fixtures
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Webview smoke
        run: pnpm test:e2e
